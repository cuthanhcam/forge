<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Forge is a local-first developer workstation for formatting, decoding, comparing, encoding, generating, and validating everyday developer input."
    />
    <meta name="application-name" content="Forge" />
    <meta name="apple-mobile-web-app-title" content="Forge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      body {
        margin: 0;
      }
      .forge-boot {
        box-sizing: border-box;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff;
        color: #475569;
        font:
          14px/1.6 system-ui,
          sans-serif;
      }
      .dark .forge-boot {
        background: #0d1117;
        color: #c9d1d9;
      }
      .forge-boot-loading,
      .forge-boot-failure {
        width: min(100%, 360px);
        text-align: center;
      }
      .forge-boot-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 24px;
      }
      .forge-boot-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #94a3b833;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: forge-boot-spin 1s linear infinite;
      }
      .forge-boot-track {
        height: 3px;
        width: 160px;
        overflow: hidden;
        margin: 20px auto 0;
        border-radius: 4px;
        background: #94a3b822;
      }
      .forge-boot-track::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        background: #2563eb;
        animation: forge-boot-progress 1.4s ease-in-out infinite alternate;
      }
      .forge-boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      .forge-boot-failure {
        display: none;
      }
      .forge-boot[data-failed] .forge-boot-loading {
        display: none;
      }
      .forge-boot[data-failed] .forge-boot-failure {
        display: block;
      }
      .forge-boot h1 {
        margin: 0 0 16px;
        color: inherit;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.35;
        outline: none;
      }
      .forge-boot-alert {
        display: block;
        margin: 0 auto 20px;
        color: #2563eb;
      }
      .dark .forge-boot-alert {
        color: #6e9af7;
      }
      .forge-boot-failure p {
        margin: 0;
      }
      .forge-boot-failure button {
        margin-top: 20px;
      }
      .forge-boot button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        margin-top: 12px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .forge-boot button:hover {
        background: #1d4ed8;
      }
      .forge-boot button:focus-visible {
        outline: 2px solid #6e9af7;
        outline-offset: 3px;
      }
      @keyframes forge-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes forge-boot-progress {
        from {
          transform: translateX(-50%);
        }
        to {
          transform: translateX(180%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .forge-boot-spinner,
        .forge-boot-track::after {
          animation: none;
        }
      }
    </style>
    <script>
      (() => {
        const storageKey = "forge.theme";
        const validModes = new Set(["light", "dark", "system"]);

        function getSystemTheme() {
          return window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        let mode = "light";

        try {
          const storedMode = window.localStorage.getItem(storageKey);

          if (storedMode) {
            const parsedMode = JSON.parse(storedMode);

            if (validModes.has(parsedMode)) {
              mode = parsedMode;
            }
          }
        } catch {
          mode = "light";
        }

        const resolvedMode = mode === "system" ? getSystemTheme() : mode;
        const isDark = resolvedMode === "dark";
        const themeColor = isDark ? "#0d1117" : "#ffffff";
        const root = document.documentElement;

        root.classList.toggle("dark", isDark);
        root.dataset.theme = mode;
        root.style.colorScheme = resolvedMode;
        root.style.backgroundColor = themeColor;

        const themeColorMeta = document.querySelector('meta[name="theme-color"]');

        if (themeColorMeta) {
          themeColorMeta.setAttribute("content", themeColor);
        }

        // This recovery screen must work before the application bundle is available.
        function showStartupFailure() {
          const startup = document.getElementById("root")?.firstElementChild;
          if (
            !startup ||
            startup.id !== "forge-startup" ||
            !startup.classList.contains("forge-boot")
          ) {
            if (document.readyState === "loading")
              document.addEventListener("DOMContentLoaded", showStartupFailure, {
                once: true,
              });
            return;
          }
          startup.dataset.failed = "true";
          startup.setAttribute("role", "alert");
          startup.setAttribute("aria-label", "Unable to load Forge");
          startup.removeAttribute("aria-busy");
          startup.querySelector("#forge-startup-error")?.focus();
        }
        window.addEventListener(
          "error",
          (event) => {
            if (
              (event.target instanceof HTMLScriptElement &&
                event.target.type === "module") ||
              (event instanceof ErrorEvent && event.error)
            )
              showStartupFailure();
          },
          true,
        );
      })();
    </script>
    <link rel="canonical" href="https://forge.cuthanhcam.workers.dev/" />
    <meta property="og:title" content="Forge - Developer Workstation" />
    <meta
      property="og:description"
      content="A local-first workspace for JSON, JWTs, diffs, encoders, generators, regex, and other daily developer fragments."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://forge.cuthanhcam.workers.dev/" />
    <meta property="og:site_name" content="Forge" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Forge - Developer Workstation" />
    <meta
      name="twitter:description"
      content="A calm, local-first workspace for everyday developer tools."
    />
    <link rel="icon" type="image/svg+xml" href="/forge-black.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Forge</title>
  </head>
  <body>
    <div id="root">
      <div
        id="forge-startup"
        class="forge-boot"
        role="status"
        aria-label="Loading Forge"
        aria-busy="true"
      >
        <div class="forge-boot-loading">
          <div class="forge-boot-brand">
            <span class="forge-boot-spinner" aria-hidden="true"></span
            ><strong>Forge</strong>
          </div>
          <span class="forge-boot-sr">Preparing your workspace.</span>
          <div class="forge-boot-track" aria-hidden="true"></div>
          <p id="forge-startup-slow" hidden>
            Taking longer than usual. Check your connection.<br /><button
              type="button"
              data-forge-reload
            >
              Reload page
            </button>
          </p>
        </div>
        <section class="forge-boot-failure">
          <svg
            class="forge-boot-alert"
            aria-hidden="true"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v6M12 17h.01" />
          </svg>
          <h1 id="forge-startup-error" tabindex="-1">Forge could not start</h1>
          <p>Check your connection, then reload to request the latest app files.</p>
          <button type="button" data-forge-reload>Reload page</button>
        </section>
      </div>
    </div>
    <noscript
      ><style>
        #forge-startup {
          display: none;
        }
      </style>
      <main class="forge-boot">
        <section>
          <h1>Forge needs JavaScript</h1>
          <p>Enable JavaScript to use the local tools in this browser.</p>
          <a href="https://github.com/cuthanhcam/forge">Read the project documentation</a>
        </section>
      </main></noscript
    >
    <script>
      (() => {
        const startup = document.getElementById("root")?.firstElementChild;
        if (!startup || startup.id !== "forge-startup") return;
        startup
          .querySelectorAll("[data-forge-reload]")
          .forEach((button) =>
            button.addEventListener("click", () => window.location.reload()),
          );
        window.setTimeout(() => {
          if (!startup.isConnected) return;
          const slow = startup.querySelector("#forge-startup-slow");
          if (slow) slow.hidden = false;
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
